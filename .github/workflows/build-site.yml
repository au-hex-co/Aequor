name: Build site

on:
  push:
    branches: [master]
    paths:
      - "wiki/**"
      - "world/**"
      - "Isle of creation.cartographer.json"
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node site/build.mjs

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to docs/ - nothing to commit."
          else
            git commit -m "Rebuild site from wiki [skip ci]"
            git push
          fi
